name: NFL pipeline

# GitHub starts scheduled runs LATE, and not by a little: in the first two weeks of Nov 2026 every run
# started 4-9 hours after its cron time (the "Sunday 10:40 AM" refresh ran at 2:44 PM, after the noon
# games had kicked off). A run is cheap (~2 min) and repeating it is harmless: predictions freeze at
# kickoff, so a later run only updates games that haven't started. So each job is scheduled several
# times, hours apart, and whichever attempts land before kickoff do the work.
# Cron times are UTC. The Central times in the comments are for Nov-Feb (CST = UTC-6); in Sep-Oct
# (CDT = UTC-5) the same cron fires one hour later on the clock. Minute 17/47 avoids the top-of-hour rush.
# The LAST field (weekday) picks the command: 2 = Tue -> full, 1 = Mon -> score, anything else -> refresh.
on:
  schedule:
    - cron: "17 10,14 * 1,2,9-12 2"       # Tue 4:17 AM, 8:17 AM CST           -> full (new week: retrain, predict)
    - cron: "17 12,16,20 * 1,2,9-12 4"    # Thu 6:17 AM, 10:17 AM, 2:17 PM CST -> refresh (before Thursday night)
    - cron: "17 3,15 * 1,2,9-12 6"        # Fri 9:17 PM, Sat 9:17 AM CST       -> refresh (Friday's final injury report; Saturday games)
    - cron: "17 9,12,15 * 1,2,9-12 0"     # Sun 3:17 AM, 6:17 AM, 9:17 AM CST  -> refresh (before the noon games)
    - cron: "47 16 * 1,2,9-12 0"          # Sun 10:47 AM CST                   -> refresh (after inactives, if it runs on time)
    - cron: "17 12,18 * 1,2,9-12 1"       # Mon 6:17 AM, 12:17 PM CST          -> score
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [full, refresh, score, backtest]
        default: full

permissions:
  contents: write     # commit updated data back to the repo
  pages: write        # publish the dashboard
  id-token: write     # required by deploy-pages
  issues: write       # open an issue when a run fails

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick command
        id: cmd
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.command }}
        run: |
          if [ -n "$INPUT" ]; then CMD="$INPUT"
          else
            case "$SCHEDULE" in
              *" 2") CMD=full ;;      # Tuesday
              *" 1") CMD=score ;;     # Monday
              *)     CMD=refresh ;;   # Thursday / Sunday
            esac
          fi
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo "Running: $CMD"

      - name: Run pipeline
        run: python run.py ${{ steps.cmd.outputs.command }}

      - name: Commit updated data
        run: |
          git config user.name "nfl-pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data MODEL_REPORT.md
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Pipeline: ${{ steps.cmd.outputs.command }} $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      # Only reached if everything above succeeded, so a failed run never replaces the live site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Pipeline failed: ${{ steps.cmd.outputs.command || 'run' }} on $(date -u +%Y-%m-%d)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The dashboard still shows the previous successful run."

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
